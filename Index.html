<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uji Halaman Luar LMS</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f0fdf4;
      color:#14532d;
    }
    .card{
      width:min(100%,420px);
      background:#fff;
      border:1px solid #bbf7d0;
      border-radius:18px;
      padding:28px 22px;
      text-align:center;
      box-shadow:0 8px 24px rgba(20,83,45,.08);
    }
    .logo{
      width:70px;
      height:70px;
      margin:0 auto 16px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:#16a34a;
      color:#fff;
      font-size:34px;
      font-weight:700;
    }
    h1{font-size:22px;margin:0 0 8px}
    p{margin:8px 0;color:#64748b;line-height:1.5}
    .status{
      margin-top:18px;
      padding:12px;
      border-radius:10px;
      background:#dcfce7;
      color:#166534;
      font-weight:700;
    }
    small{display:block;margin-top:16px;color:#94a3b8}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">L</div>
    <h1>LMS SDN 1 Tanjungkerta</h1>
    <p>Halaman uji di luar Google Apps Script.</p>
    <div class="status">✓ Halaman luar berhasil dibuka</div>
    <small>Uji tahap 1 — belum terhubung ke data LMS.</small>
  </main>
</body>
</html>
